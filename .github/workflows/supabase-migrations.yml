name: Deploy Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brandon-rv-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require production secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "::error::Missing SUPABASE_DB_PASSWORD repository secret" && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo "::error::Missing SUPABASE_PROJECT_ID repository secret" && exit 1)

      - name: Install Supabase CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/supabase-cli.tar.gz"
          install_dir="$RUNNER_TEMP/supabase-cli"
          mkdir -p "$install_dir"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
            "https://github.com/supabase/cli/releases/download/v2.122.1/supabase_2.122.1_linux_amd64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$install_dir"
          sudo install -m 0755 "$install_dir/supabase" /usr/local/bin/supabase
          supabase --version

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        run: supabase db push --dry-run --linked

      - name: Apply pending migrations
        run: supabase db push --yes --linked
