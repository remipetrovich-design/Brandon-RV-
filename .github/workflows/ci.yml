name: Website checks and database migrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending production migrations (turn off for preview only)
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check migration filenames and references
        run: node scripts/check-migrations.mjs
      - name: Install dependencies
        run: npm install
      - name: Test user-role access policy
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build website
        run: npm run build

  migrate-production:
    name: Apply Supabase migrations (production)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: brandon-rv-supabase-production-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: thkxalrsklgademwrrlq
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing GitHub Actions secret SUPABASE_DB_PASSWORD"; exit 1; }
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - name: Compare local and production migration history
        run: supabase migration list --remote --password "$SUPABASE_DB_PASSWORD"
      - name: Preview pending database migrations
        run: supabase db push --include-all --dry-run --remote="$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply pending database migrations
        if: github.event_name != 'workflow_dispatch' || inputs.apply_migrations
        run: supabase db push --include-all --yes --remote="$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Verify no migrations remain pending
        if: github.event_name != 'workflow_dispatch' || inputs.apply_migrations
        run: |
          supabase migration list --remote --password "$SUPABASE_DB_PASSWORD"
          supabase db push --include-all --dry-run --remote="$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Capture production migration status
        if: always()
        shell: bash
        run: |
          set +e
          if command -v supabase >/dev/null 2>&1 && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase migration list --remote --password "$SUPABASE_DB_PASSWORD" > migration-status.txt 2>&1
          else
            echo "Supabase CLI or database credentials unavailable; inspect the failed setup step." > migration-status.txt
          fi
          cat migration-status.txt
          {
            echo "## Production migration history (diagnostic)"
            echo '~~~text'
            cat migration-status.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload migration status diagnostic
        if: always() && hashFiles('migration-status.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-status
          path: migration-status.txt
          if-no-files-found: ignore
          retention-days: 14

  notify-failure:
    name: Notify repository owner about failed checks or migrations
    if: always() && (needs.check.result == 'failure' || needs.migrate-production.result == 'failure')
    needs: [check, migrate-production]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Create or update migration failure alert
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = "https://github.com/" + owner + "/" + repo + "/actions/runs/" + context.runId;
            const failed = "Checks: ${{ needs.check.result }}\nProduction migrations: ${{ needs.migrate-production.result }}";
            const title = "[ACTION REQUIRED] Brandon RV checks or production migrations failed";
            const body = [
              "@remipetrovich-design Production database migrations or required checks have failed. Please review this run.",
              "",
              "- Workflow run: " + runUrl,
              "- Branch: " + context.ref,
              "- Commit: " + context.sha,
              "- Trigger: " + context.eventName,
              "- Result:",
              failed,
              "",
              "The migration job records the remote migration history in its job summary and uploads a diagnostic artifact when it can connect to Supabase.",
              "Do not assume all pending migrations were applied. Open the run and confirm the final remote migration history."
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: "Another failure was detected.\n\n" + body
              });
              core.info("Updated existing failure issue #" + existing.number);
            } else {
              const issue = await github.rest.issues.create({ owner, repo, title, body });
              core.info("Created failure issue #" + issue.data.number);
            }
