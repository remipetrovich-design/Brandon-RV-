name: Website checks and database migrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check migration filenames and references
        run: node scripts/check-migrations.mjs

      - name: Install dependencies
        run: npm install

      - name: Test user-role access policy
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build website
        run: npm run build

  migrate-production:
    name: Apply Supabase migrations (production)
    # Only deploy after a successful push to main (including a merged PR).
    # Pull requests run checks but never change the database.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: brandon-rv-supabase-production-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: thkxalrsklgademwrrlq
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing GitHub Actions secret SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0

      - name: Preview pending database migrations
        run: supabase db push --dry-run --remote="$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply pending database migrations
        run: supabase db push --yes --remote="$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify applied migration history
        run: supabase migration list --remote --password "$SUPABASE_DB_PASSWORD"
