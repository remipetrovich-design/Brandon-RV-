name: Package standalone licence module
on:
  push:
    branches: [main]
    paths:
      - "standalone-license-module/**"
      - ".github/workflows/package-license-module.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test standalone module
        working-directory: standalone-license-module
        run: node --test
      - name: Create portable ZIP
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./standalone-license-module/package.json').version")"
          mkdir -p dist
          zip -r "dist/standalone-license-module-v${VERSION}.zip" standalone-license-module
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-license-module-v${{ steps.package.outputs.version }}
          path: dist/standalone-license-module-v${{ steps.package.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 90
