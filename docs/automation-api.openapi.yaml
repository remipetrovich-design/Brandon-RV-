openapi: 3.1.0
info:
  title: Brandon RV Integration API
  version: 1.0.0
  description: Vendor-neutral API. Current implementation exposes scoped, tenant-isolated reads. Write operations are under development and must not be assumed available.
servers:
  - url: https://{brandonRvHost}/api/integrations/v1
    variables:
      brandonRvHost:
        default: your-brandon-rv-domain
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Business
  - name: Customers
  - name: Operations
  - name: Finance
  - name: Workforce
paths:
  /:
    get:
      tags: [System]
      operationId: getIntegrationCapabilities
      summary: Discover API version, resources and permissions
      responses:
        '200':
          description: API capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  version: { type: string }
                  enabled: { type: boolean }
                  authentication: { type: string }
                  resources: { type: array, items: { type: object } }
                  permissionGroups: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: API globally paused by administrator }
  /business:
    get:
      tags: [Business]
      operationId: getBusiness
      x-required-scope: business.read
      responses:
        '200': { description: Business profile }
        '403': { $ref: '#/components/responses/Forbidden' }
  /services:
    get:
      tags: [Business]
      operationId: listServices
      x-required-scope: services.read
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /service-areas:
    get:
      tags: [Business]
      operationId: listServiceAreas
      x-required-scope: service_areas.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      x-required-scope: customers.read
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /vehicles:
    get:
      tags: [Customers]
      operationId: listVehicles
      x-required-scope: vehicles.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /enquiries:
    get:
      tags: [Operations]
      operationId: listEnquiries
      x-required-scope: enquiries.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /quotes:
    get:
      tags: [Operations]
      operationId: listQuotes
      x-required-scope: quotes.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /appointments:
    get:
      tags: [Operations]
      operationId: listAppointments
      x-required-scope: appointments.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /workcards:
    get:
      tags: [Operations]
      operationId: listWorkcards
      x-required-scope: workcards.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /work-entries:
    get:
      tags: [Operations]
      operationId: listWorkEntries
      x-required-scope: work_entries.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /parts:
    get:
      tags: [Operations]
      operationId: listParts
      x-required-scope: parts.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /suppliers:
    get:
      tags: [Operations]
      operationId: listSuppliers
      x-required-scope: suppliers.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /supplier-orders:
    get:
      tags: [Operations]
      operationId: listSupplierOrders
      x-required-scope: supplier_orders.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /invoices:
    get:
      tags: [Finance]
      operationId: listInvoices
      x-required-scope: invoices.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /expenses:
    get:
      tags: [Finance]
      operationId: listExpenses
      x-required-scope: expenses.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /staff:
    get:
      tags: [Workforce]
      operationId: listStaff
      x-required-scope: staff.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /time-entries:
    get:
      tags: [Workforce]
      operationId: listTimeEntries
      x-required-scope: time_entries.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /leave:
    get:
      tags: [Workforce]
      operationId: listLeave
      x-required-scope: leave.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /payroll:
    get:
      tags: [Workforce]
      operationId: listPayroll
      x-required-scope: payroll.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /website:
    get:
      tags: [Business]
      operationId: listWebsitePages
      x-required-scope: website.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /business-settings:
    get:
      tags: [Business]
      operationId: getBusinessSettings
      x-required-scope: business.settings.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /communications:
    get:
      tags: [Operations]
      operationId: listCustomerCommunications
      x-required-scope: communications.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /tasks:
    get:
      tags: [Operations]
      operationId: listWorkTasks
      x-required-scope: tasks.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /assets:
    get:
      tags: [Workforce]
      operationId: listEmployeeAssets
      x-required-scope: assets.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
  /onboarding:
    get:
      tags: [Workforce]
      operationId: listOnboardingTasks
      x-required-scope: onboarding.read
      responses: { '200': { $ref: '#/components/responses/PaginatedRecords' } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: BrandonRVIntegrationKey
  parameters:
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    Unauthorized:
      description: Missing, invalid, expired or revoked credential
    Forbidden:
      description: Permission not granted to this credential
    PaginatedRecords:
      description: Paginated records belonging to the credential's business
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { type: object, additionalProperties: true } }
              pagination:
                type: object
                properties:
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalItems: { type: integer }
                  totalPages: { type: integer }
              requestId: { type: string }
